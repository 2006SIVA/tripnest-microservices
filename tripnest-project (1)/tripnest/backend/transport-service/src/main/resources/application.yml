server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: transport-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/transportdb}
    username: ${SPRING_DATASOURCE_USERNAME:transport}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
