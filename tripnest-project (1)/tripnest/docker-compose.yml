services:
  user-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d userdb"]
      interval: 5s
      timeout: 3s
      retries: 15

  travel-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traveldb
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: ${TRAVEL_DB_PASSWORD:?Set TRAVEL_DB_PASSWORD in .env}
    volumes:
      - travel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d traveldb"]
      interval: 5s
      timeout: 3s
      retries: 15

  hotel-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hoteldb
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: ${HOTEL_DB_PASSWORD:?Set HOTEL_DB_PASSWORD in .env}
    volumes:
      - hotel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hoteldb"]
      interval: 5s
      timeout: 3s
      retries: 15

  transport-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: transportdb
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: ${TRANSPORT_DB_PASSWORD:?Set TRANSPORT_DB_PASSWORD in .env}
    volumes:
      - transport-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport -d transportdb"]
      interval: 5s
      timeout: 3s
      retries: 15

  booking-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookingdb
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD in .env}
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d bookingdb"]
      interval: 5s
      timeout: 3s
      retries: 15

  payment-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d paymentdb"]
      interval: 5s
      timeout: 3s
      retries: 15

  user-service:
    build: {context: ., dockerfile: infra/Dockerfile, args: {MODULE: user-service}}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SERVICE_SECRET: ${SERVICE_SECRET:?Set SERVICE_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-TripNest Admin}
    depends_on: {user-db: {condition: service_healthy}}

  travel-service:
    build: {context: ., dockerfile: infra/Dockerfile, args: {MODULE: travel-service}}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://travel-db:5432/traveldb
      SPRING_DATASOURCE_USERNAME: travel
      SPRING_DATASOURCE_PASSWORD: ${TRAVEL_DB_PASSWORD:?Set TRAVEL_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SERVICE_SECRET: ${SERVICE_SECRET:?Set SERVICE_SECRET in .env}
    depends_on: {travel-db: {condition: service_healthy}}

  hotel-service:
    build: {context: ., dockerfile: infra/Dockerfile, args: {MODULE: hotel-service}}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hotel-db:5432/hoteldb
      SPRING_DATASOURCE_USERNAME: hotel
      SPRING_DATASOURCE_PASSWORD: ${HOTEL_DB_PASSWORD:?Set HOTEL_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SERVICE_SECRET: ${SERVICE_SECRET:?Set SERVICE_SECRET in .env}
    depends_on: {hotel-db: {condition: service_healthy}}

  transport-service:
    build: {context: ., dockerfile: infra/Dockerfile, args: {MODULE: transport-service}}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://transport-db:5432/transportdb
      SPRING_DATASOURCE_USERNAME: transport
      SPRING_DATASOURCE_PASSWORD: ${TRANSPORT_DB_PASSWORD:?Set TRANSPORT_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SERVICE_SECRET: ${SERVICE_SECRET:?Set SERVICE_SECRET in .env}
    depends_on: {transport-db: {condition: service_healthy}}

  booking-service:
    build: {context: ., dockerfile: infra/Dockerfile, args: {MODULE: booking-service}}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/bookingdb
      SPRING_DATASOURCE_USERNAME: booking
      SPRING_DATASOURCE_PASSWORD: ${BOOKING_DB_PASSWORD:?Set BOOKING_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SERVICE_SECRET: ${SERVICE_SECRET:?Set SERVICE_SECRET in .env}
      services.travel-url: http://travel-service:8080
      services.hotel-url: http://hotel-service:8080
      services.transport-url: http://transport-service:8080
    depends_on:
      booking-db: {condition: service_healthy}
      travel-service: {condition: service_started}
      hotel-service: {condition: service_started}
      transport-service: {condition: service_started}

  payment-service:
    build: {context: ., dockerfile: infra/Dockerfile, args: {MODULE: payment-service}}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SERVICE_SECRET: ${SERVICE_SECRET:?Set SERVICE_SECRET in .env}
      services.booking-url: http://booking-service:8080
    depends_on:
      payment-db: {condition: service_healthy}
      booking-service: {condition: service_started}

  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./infra/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - travel-service
      - hotel-service
      - transport-service
      - booking-service
      - payment-service

  # Independent micro-frontend applications. Each can be built/deployed without the others.
  shell-ui:
    build: {context: ., dockerfile: infra/Dockerfile.frontend, args: {APP: shell}}
    restart: unless-stopped
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api-gateway]

  user-ui:
    build: {context: ., dockerfile: infra/Dockerfile.frontend, args: {APP: user-ui}}
    restart: unless-stopped
    ports: ["127.0.0.1:5174:80"]
    depends_on: [api-gateway]

  travel-ui:
    build: {context: ., dockerfile: infra/Dockerfile.frontend, args: {APP: travel-ui}}
    restart: unless-stopped
    ports: ["127.0.0.1:5175:80"]
    depends_on: [api-gateway]

  hotel-ui:
    build: {context: ., dockerfile: infra/Dockerfile.frontend, args: {APP: hotel-ui}}
    restart: unless-stopped
    ports: ["127.0.0.1:5176:80"]
    depends_on: [api-gateway]

  transport-ui:
    build: {context: ., dockerfile: infra/Dockerfile.frontend, args: {APP: transport-ui}}
    restart: unless-stopped
    ports: ["127.0.0.1:5177:80"]
    depends_on: [api-gateway]

  booking-ui:
    build: {context: ., dockerfile: infra/Dockerfile.frontend, args: {APP: booking-ui}}
    restart: unless-stopped
    ports: ["127.0.0.1:5178:80"]
    depends_on: [api-gateway]

  payment-ui:
    build: {context: ., dockerfile: infra/Dockerfile.frontend, args: {APP: payment-ui}}
    restart: unless-stopped
    ports: ["127.0.0.1:5179:80"]
    depends_on: [api-gateway]

  # Legacy single-frontend deployment retained for rollback/reference.
  web:
    build: {context: ., dockerfile: infra/Dockerfile.web}
    restart: unless-stopped
    ports: ["127.0.0.1:8060:80"]
    depends_on: [api-gateway]

volumes:
  user-db-data:
  travel-db-data:
  hotel-db-data:
  transport-db-data:
  booking-db-data:
  payment-db-data:
